name: __MODULENAME__

options:
  defaultConfig: Release
  deploymentTarget:
    iOS: __DEPLOYMENTTARGET__

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Project
    SWIFT_VERSION: 5
    SDKROOT: iphoneos
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    SWIFT_EMIT_LOC_STRINGS: 'NO'
    LOCALIZED_STRING_SWIFTUI_SUPPORT: 'NO'
    PRODUCT_BUNDLE_IDENTIFIER: __PROJECTBUNDLEPREFIX__.$(PRODUCT_NAME)
    PRODUCT_NAME: $(TARGET_NAME)
    STRIP_INSTALLED_PRODUCT: 'NO'
    ALWAYS_SEARCH_USER_PATHS: 'NO'

    # Target
    IPHONEOS_DEPLOYMENT_TARGET: '__DEPLOYMENTTARGET__'
    TARGET_DEVICE_FAMILY: '1'
    
    # Signing
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: iPhone Developer
    DEVELOPMENT_TEAM: __PROJECTDEVELOPMENTTEAM__
    PROVISIONING_PROFILE:
    PROVISIONING_PROFILE_SPECIFIER:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_TESTABILITY: 'YES'
      ONLY_ACTIVE_ARCH: 'YES'
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  __MODULENAME__:
    type: framework
    platform: iOS
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        INSTALL_PATH: "@rpath"

  __MODULENAME__Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
    - target: __MODULENAME__
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: 'YES'
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: 'YES'
