name: Release .app

on:
  push:
    branches:
      - 'main'

jobs:
  release:
    name: Run release
    permissions: 
      contents: write
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get tag
        id: get_tag
        run: |
          TAG=$(head -n 1 version)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'

      - name: Generate project
        run: |
          brew install xcodegen
          gem install xcodeproj --no-document
          make build

      - name: Run build
        run: |
          make app-for-action
      
      - name: Zip build files
        run: |
          PROJECT_NAME=`grep '^name:' project.yml | sed 's/^name: //'`
          mkdir App
          mv build/$PROJECT_NAME-iossimulator.xcarchive/Products/Applications/$PROJECT_NAME.app App
          mv build/$PROJECT_NAME-iossimulator.xcarchive/dSYMs/$PROJECT_NAME.app.dSYM App
          zip -r App.zip App

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          files: App.zip
